name: Compatibility

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true
          version: 2026.7.15
      - name: Install dependencies
        run: bun ci --ignore-scripts
      - name: Check package
        run: bun run package:check
      - name: Pack checked package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          bun pm pack \
            --filename "$RUNNER_TEMP/package/react-native-rating.tgz" \
            --ignore-scripts
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: package
          path: ${{ runner.temp }}/package/react-native-rating.tgz
          retention-days: 1

  compatibility:
    name: React Native ${{ matrix.react-native }}
    continue-on-error: ${{ matrix.experimental }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - experimental: false
            react: 19.1.1
            react-native: 0.82.1
            react-types: 19.1.17
          - experimental: false
            react: 19.2.8
            react-native: 0.83.10
            react-types: 19.2.17
          - experimental: false
            react: 19.2.8
            react-native: 0.84.1
            react-types: 19.2.17
          - experimental: false
            react: 19.2.8
            react-native: 0.85.3
            react-types: 19.2.17
          - experimental: false
            react: 19.2.8
            react-native: 0.86.2
            react-types: 19.2.17
          - experimental: true
            react: 19.2.8
            react-native: next
            react-types: 19.2.17
          - experimental: true
            react: 19.2.8
            react-native: nightly
            react-types: 19.2.17
    steps:
      - name: Check out compatibility fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true
          version: 2026.7.15
      - name: Download checked package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Check consumer compatibility
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/package/react-native-rating.tgz
          REACT_NATIVE_VERSION: ${{ matrix.react-native }}
          REACT_TYPES_VERSION: ${{ matrix.react-types }}
          REACT_VERSION: ${{ matrix.react }}
        run: bash .github/scripts/check-package.sh
