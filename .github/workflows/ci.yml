name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true
          version: 2026.7.15
      - name: Install dependencies
        run: bun ci --ignore-scripts
      - name: Check source and package
        run: mise run check
      - name: Add coverage summary
        run: |
          node --input-type=commonjs <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const { total } = require("./coverage/coverage-summary.json");
          const metrics = ["statements", "branches", "functions", "lines"];
          console.log("## Coverage\n");
          console.log("| Metric | Covered |\n| --- | ---: |");
          for (const metric of metrics) {
            console.log(`| ${metric} | ${total[metric].pct}% |`);
          }
          NODE
      - name: Pack checked package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          bun pm pack \
            --filename "$RUNNER_TEMP/package/react-native-rating.tgz" \
            --ignore-scripts
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: coverage
          path: coverage
          retention-days: 14
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: package
          path: ${{ runner.temp }}/package/react-native-rating.tgz
          retention-days: 7

  compatibility:
    name: React Native (${{ matrix.label }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            react: 19.1.1
            react-native: 0.82.0
            react-types: 19.1.17
          - label: current
            react: current
            react-native: current
            react-types: current
    steps:
      - name: Check out compatibility fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true
          version: 2026.7.15
      - name: Download checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Check consumer compatibility
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/package/react-native-rating.tgz
          REACT_NATIVE_VERSION: ${{ matrix.react-native }}
          REACT_TYPES_VERSION: ${{ matrix.react-types }}
          REACT_VERSION: ${{ matrix.react }}
        run: bash .github/scripts/check-package.sh

  expo-web:
    name: Expo Web
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Expo example
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true
          version: 2026.7.15
      - name: Download checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Type-check, export, and server-render Expo Web
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/package/react-native-rating.tgz
        run: bash .github/scripts/check-expo-web.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
